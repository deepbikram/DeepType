name: Build DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" == "v$(tr -d '[:space:]' < VERSION)" ]] || { echo "tag $GITHUB_REF_NAME != VERSION $(cat VERSION)"; exit 1; }

      - name: Build app (release, arm64)
        run: bash scripts/build-app.sh release arm64

      - name: Package DMG
        run: |
          pip install dmgbuild
          BIN_DIR="$(swift build -c release --arch arm64 --show-bin-path)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DMG="DeepType-${VERSION}-arm64.dmg"
          # ponytail: styled drag-and-drop DMG via scripts/create-dmg.sh
          # (dmgbuild writes icon positions + background headless).
          bash scripts/create-dmg.sh "$BIN_DIR/DeepType.app" "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Generate appcast
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SIGN_UPDATE="$(find .build/artifacts -path '*/Sparkle/bin/sign_update' | head -1)"
          KEY_FILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGNATURE="$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "$DMG")"
          rm -f "$KEY_FILE"
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '    <channel>'
            echo '        <title>DeepType</title>'
            echo '        <item>'
            echo "            <title>Version $VERSION (arm64)</title>"
            echo "            <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>"
            echo "            <link>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</link>"
            echo "            <sparkle:version>$VERSION</sparkle:version>"
            echo "            <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>"
            echo "            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>"
            echo "            <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>"
            echo "            <enclosure url=\"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$DMG\" type=\"application/octet-stream\" $SIGNATURE/>"
            echo '        </item>'
            echo '    </channel>'
            echo '</rss>'
          } > appcast.xml
          echo "APPCAST=appcast.xml" >> "$GITHUB_ENV"
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepType-macOS-arm64
          path: |
            DeepType-*.dmg
            appcast.xml

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" "$APPCAST" \
            --title "DeepType $GITHUB_REF_NAME" \
            --notes "Unsigned build (no notarization): on first launch, right-click DeepType.app > Open, or System Settings > Privacy & Security > Open Anyway." \
            --latest || gh release upload "$GITHUB_REF_NAME" "$DMG" "$APPCAST" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
